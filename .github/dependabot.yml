version: 2
updates:
  - package-ecosystem: bundler
    directories:
    - /mobile/android
    - /mobile/ios
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      routine-updates:
        patterns:
        - '*'
        update-types:
        - minor
        - patch
